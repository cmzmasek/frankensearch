[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "frankensearch"
dynamic = ["version"]
description = "Chance-similarity search of short fusion ('franken') protein sequences against species-restricted databases."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "czmasek", email = "czmasek@jcvi.org" }]
keywords = ["bioinformatics", "blast", "protein", "sequence-search"]

dependencies = [
    "typer>=0.12",
    "rich>=13",
    "biopython>=1.83",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
frankensearch = "frankensearch.cli:main"

[tool.hatch.version]
path = "src/frankensearch/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/frankensearch"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Typer's API intentionally uses these as argument defaults.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
